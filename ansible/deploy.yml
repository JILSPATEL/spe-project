- hosts: web
  become: true

  vars:
    backend_image: "{{ backend_repo }}:{{ tag }}"
    frontend_image: "{{ frontend_repo }}:{{ tag }}"

  tasks:

    # 1️⃣ Create network
    - name: Create app network
      docker_network:
        name: app-net

    # 2️⃣ Remove old containers
    - name: Remove backend container
      docker_container:
        name: ecommerce_backend
        state: absent
      ignore_errors: yes

    - name: Remove frontend container
      docker_container:
        name: ecommerce_frontend
        state: absent
      ignore_errors: yes

    # 3️⃣ Remove old images
    - name: Remove old backend images
      shell: |
        docker images "{{ backend_repo }}" --format "{{ '{{.Repository}}:{{.Tag}}' }}" | grep -v "{{ tag }}" | xargs -r docker rmi -f
      ignore_errors: yes

    - name: Remove old frontend images
      shell: |
        docker images "{{ frontend_repo }}" --format "{{ '{{.Repository}}:{{.Tag}}' }}" | grep -v "{{ tag }}" | xargs -r docker rmi -f
      ignore_errors: yes

    # 4️⃣ Pull latest images
    - name: Pull backend image
      docker_image:
        name: "{{ backend_image }}"
        source: pull

    - name: Pull frontend image
      docker_image:
        name: "{{ frontend_image }}"
        source: pull

    # 5️⃣ Run backend
    - name: Run backend container
      docker_container:
        name: ecommerce_backend
        image: "{{ backend_image }}"
        state: started
        restart_policy: always
        networks:
          - name: app-net
        published_ports:
          - "{{ backend_port }}:{{ backend_port }}"
        env:
          PORT: "{{ backend_port }}"
          DB_HOST: "{{ db_host }}"
          DB_PORT: "{{ db_port }}"
          DB_USER: "{{ db_user }}"
          DB_PASSWORD: "{{ db_password }}"
          DB_NAME: "{{ db_name }}"
          FRONTEND_URL: "{{ frontend_url }}"
          JWT_SECRET: "{{ jwt_secret }}"
          NODE_ENV: "{{ node_env }}"
        etc_hosts:
          host.docker.internal: "host-gateway"

    # 6️⃣ Run frontend
    - name: Run frontend container
      docker_container:
        name: ecommerce_frontend
        image: "{{ frontend_image }}"
        state: started
        restart_policy: always
        networks:
          - name: app-net
        published_ports:
          - "3000:5173"
        env:
          VITE_PROXY_TARGET: "http://ecommerce_backend:{{ backend_port }}"