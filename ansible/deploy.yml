- hosts: web
  become: true

  vars:
    backend_repo: "{{ lookup('env', 'IMAGE_BACKEND') | default('jilspatel/backend') }}"
    frontend_repo: "{{ lookup('env', 'IMAGE_FRONTEND') | default('jilspatel/frontend') }}"
    backend_image: "{{ backend_repo }}:{{ tag }}"
    frontend_image: "{{ frontend_repo }}:{{ tag }}"
    db_host: "{{ lookup('env', 'DB_HOST') | default('host.docker.internal') }}"
    db_port: "{{ lookup('env', 'DB_PORT') | default('3306') }}"
    db_user: "{{ lookup('env', 'DB_USER') | default('root') }}"
    db_password: "{{ lookup('env', 'DB_PASSWORD') }}"
    db_name: "{{ lookup('env', 'DB_NAME') | default('ecommerce_solution') }}"
    frontend_url: "{{ lookup('env', 'FRONTEND_URL') | default('http://localhost:3000') }}"
    jwt_secret: "{{ lookup('env', 'JWT_SECRET') }}"
    node_env: "{{ lookup('env', 'NODE_ENV') | default('development') }}"
    backend_port: "{{ lookup('env', 'PORT') | default('5000') }}"

  tasks:

    # 1️⃣ Create network
    - name: Create app network
      docker_network:
        name: app-net

    # 2️⃣ Remove old containers
    - name: Remove backend container
      docker_container:
        name: ecommerce_backend
        state: absent
      ignore_errors: yes

    - name: Remove frontend container
      docker_container:
        name: ecommerce_frontend
        state: absent
      ignore_errors: yes

    # 3️⃣ Remove old images
    - name: Remove old backend images
      shell: |
        docker images "{{ backend_repo }}" --format "{{ '{{.Repository}}:{{.Tag}}' }}" | grep -v "{{ tag }}" | xargs -r docker rmi -f
      ignore_errors: yes

    - name: Remove old frontend images
      shell: |
        docker images "{{ frontend_repo }}" --format "{{ '{{.Repository}}:{{.Tag}}' }}" | grep -v "{{ tag }}" | xargs -r docker rmi -f
      ignore_errors: yes

    # 4️⃣ Pull latest images
    - name: Pull backend image
      docker_image:
        name: "{{ backend_image }}"
        source: pull

    - name: Pull frontend image
      docker_image:
        name: "{{ frontend_image }}"
        source: pull

    # 5️⃣ Run backend
    - name: Run backend container
      docker_container:
        name: ecommerce_backend
        image: "{{ backend_image }}"
        state: started
        restart_policy: always
        networks:
          - name: app-net
        published_ports:
          - "{{ backend_port }}:{{ backend_port }}"
        env:
          PORT: "{{ backend_port }}"
          DB_HOST: "{{ db_host }}"
          DB_PORT: "{{ db_port }}"
          DB_USER: "{{ db_user }}"
          DB_PASSWORD: "{{ db_password }}"
          DB_NAME: "{{ db_name }}"
          FRONTEND_URL: "{{ frontend_url }}"
          JWT_SECRET: "{{ jwt_secret }}"
          NODE_ENV: "{{ node_env }}"
        etc_hosts:
          host.docker.internal: "host-gateway"

    # 6️⃣ Run frontend
    - name: Run frontend container
      docker_container:
        name: ecommerce_frontend
        image: "{{ frontend_image }}"
        state: started
        restart_policy: always
        networks:
          - name: app-net
        published_ports:
          - "3000:5173"