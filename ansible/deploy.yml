- hosts: web
  become: true

  vars:
    backend_repo: "jilspatel/backend"
    frontend_repo: "jilspatel/frontend"
    backend_image: "{{ backend_repo }}:{{ tag }}"
    frontend_image: "{{ frontend_repo }}:{{ tag }}"

  tasks:

    # 1️⃣ Create network
    - name: Create app network
      docker_network:
        name: app-net

    # 2️⃣ Remove old containers
    - name: Remove backend container
      docker_container:
        name: ecommerce_backend
        state: absent
      ignore_errors: yes

    - name: Remove frontend container
      docker_container:
        name: ecommerce_frontend
        state: absent
      ignore_errors: yes

    # 3️⃣ Remove old images
    - name: Remove old backend images
      shell: |
        docker images "jilspatel/backend" --format "{{.Repository}}:{{.Tag}}" | grep -v "{{ tag }}" | xargs -r docker rmi -f
      ignore_errors: yes

    - name: Remove old frontend images
      shell: |
        docker images "jilspatel/frontend" --format "{{.Repository}}:{{.Tag}}" | grep -v "{{ tag }}" | xargs -r docker rmi -f
      ignore_errors: yes

    # 4️⃣ Pull latest images
    - name: Pull backend image
      docker_image:
        name: "{{ backend_image }}"
        source: pull

    - name: Pull frontend image
      docker_image:
        name: "{{ frontend_image }}"
        source: pull

    # 5️⃣ Run backend
    - name: Run backend container
      docker_container:
        name: ecommerce_backend
        image: "{{ backend_image }}"
        state: started
        restart_policy: always
        networks:
          - name: app-net
        published_ports:
          - "5000:5000"
        env:
          PORT: "5000"
          DB_HOST: "host.docker.internal"
          DB_PORT: "3306"
          DB_USER: "root"
          DB_PASSWORD: "Jils@1863"
          DB_NAME: "ecommerce_solution"
          FRONTEND_URL: "http://localhost:3000"
          JWT_SECRET: "change_this_in_production"
          NODE_ENV: "development"
        etc_hosts:
          host.docker.internal: "host-gateway"

    # 6️⃣ Run frontend
    - name: Run frontend container
      docker_container:
        name: ecommerce_frontend
        image: "{{ frontend_image }}"
        state: started
        restart_policy: always
        networks:
          - name: app-net
        published_ports:
          - "3000:5173"