---
# 4️⃣ Pull latest images (Frontend)
- name: Pull frontend image
  docker_image:
    name: "{{ frontend_image }}"
    source: pull

# 6️⃣ Run frontend
- name: Run frontend container
  docker_container:
    name: ecommerce_frontend
    image: "{{ frontend_image }}"
    state: started
    recreate: yes
    restart_policy: always
    networks:
      - name: app-net
    published_ports:
      - "3000:5173"
    env:
      VITE_PROXY_TARGET: "http://ecommerce_api_gateway:5000"
