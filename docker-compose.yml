version: "3.9"

services:
  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    container_name: ecommerce_user_service
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 5001
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: ${NODE_ENV}
      DB_SSL: ${DB_SSL}
    networks:
      - app-net

  seller-service:
    build:
      context: ./backend/seller-service
      dockerfile: Dockerfile
    container_name: ecommerce_seller_service
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 5002
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: ${NODE_ENV}
      DB_SSL: ${DB_SSL}
    networks:
      - app-net

  product-service:
    build:
      context: ./backend/product-service
      dockerfile: Dockerfile
    container_name: ecommerce_product_service
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 5003
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: ${NODE_ENV}
      DB_SSL: ${DB_SSL}
    networks:
      - app-net

  cart-service:
    build:
      context: ./backend/cart-service
      dockerfile: Dockerfile
    container_name: ecommerce_cart_service
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 5004
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: ${NODE_ENV}
      DB_SSL: ${DB_SSL}
    networks:
      - app-net

  order-service:
    build:
      context: ./backend/order-service
      dockerfile: Dockerfile
    container_name: ecommerce_order_service
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 5005
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: ${NODE_ENV}
      DB_SSL: ${DB_SSL}
    networks:
      - app-net

  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: ecommerce_api_gateway
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: ${PORT}
      FRONTEND_URL: ${FRONTEND_URL}
      USER_SERVICE_URL: http://user-service:5001
      SELLER_SERVICE_URL: http://seller-service:5002
      PRODUCT_SERVICE_URL: http://product-service:5003
      CART_SERVICE_URL: http://cart-service:5004
      ORDER_SERVICE_URL: http://order-service:5005
    depends_on:
      - user-service
      - seller-service
      - product-service
      - cart-service
      - order-service
    networks:
      - app-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: ecommerce_frontend
    restart: unless-stopped
    ports:
      - "3000:5173"
    environment:
      - VITE_PROXY_TARGET=http://api-gateway:${PORT}
    depends_on:
      - api-gateway
    networks:
      - app-net

networks:
  app-net: