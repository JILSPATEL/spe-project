apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: ecommerce
    component: api-gateway
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: speecommproject/backend-api-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          env:
            - name: PORT
              value: "5000"
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: FRONTEND_URL
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: USER_SERVICE_URL
              value: "http://$(NODE_IP):30011"
            - name: SELLER_SERVICE_URL
              value: "http://$(NODE_IP):30012"
            - name: PRODUCT_SERVICE_URL
              value: "http://$(NODE_IP):30013"
            - name: CART_SERVICE_URL
              value: "http://$(NODE_IP):30014"
            - name: ORDER_SERVICE_URL
              value: "http://$(NODE_IP):30015"
