apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: ecommerce
    component: frontend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: speecommproject/frontend:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              API_GATEWAY_URL="${VITE_PROXY_TARGET:-http://${NODE_IP}:${API_GATEWAY_NODE_PORT}}"
              cat > /etc/nginx/conf.d/default.conf <<EOF
              server {
                  listen 5173;
                  server_name localhost;

                  location / {
                      root /usr/share/nginx/html;
                      index index.html index.htm;
                      try_files \$uri \$uri/ /index.html;
                  }

                  location /api/ {
                      proxy_pass ${API_GATEWAY_URL};
                      proxy_http_version 1.1;
                      proxy_set_header Host \$http_host;
                      proxy_set_header X-Real-IP \$remote_addr;
                      proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                      proxy_set_header X-Forwarded-Proto \$scheme;
                  }
              }
              EOF
              nginx -g 'daemon off;'
          ports:
            - containerPort: 5173
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          env:
            - name: VITE_API_URL
              value: "/api"
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: API_GATEWAY_NODE_PORT
              value: "30000"
