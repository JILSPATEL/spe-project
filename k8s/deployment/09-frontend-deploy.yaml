apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: ecommerce
    component: frontend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: speecommproject/frontend:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - sed 's#proxy_pass ${VITE_PROXY_TARGET}/;#proxy_pass ${VITE_PROXY_TARGET};#' /etc/nginx/nginx.conf.template | envsubst '${VITE_PROXY_TARGET}' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'
          ports:
            - containerPort: 5173
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          env:
            - name: VITE_API_URL
              value: "/api"
            - name: VITE_PROXY_TARGET
              value: "http://api-gateway:5000"
