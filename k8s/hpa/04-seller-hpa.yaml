apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: seller-service-hpa
  labels:
    app: ecommerce
    component: seller-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: seller-service
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
